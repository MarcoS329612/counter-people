[project]
name = "people-counter"
version = "0.1.0"
description = "Live people counter for a conference room, built with YOLO"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "python-dotenv>=1.2.3",
    "segno>=1.6.6",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.162",
    "uvicorn>=0.53.0",
]

[project.scripts]
people-counter = "people_counter.entrypoints.cli:main"
people-counter-web = "people_counter.entrypoints.web:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports, undefined names
    "I",       # import order
    "UP",      # modern Python syntax
    "B",       # bugbear: likely bugs
    "SIM",     # simplifications
    "RUF",     # Ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
# Diagram scripts: long SVG strings, and ×, – are deliberate typography.
"docs/**" = ["E501", "RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true  # so tests/unit/test_x.py is the module "tests.unit.test_x"

[[tool.mypy.overrides]]
# Tests use small fakes; checking that the code under test is typed is enough.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
